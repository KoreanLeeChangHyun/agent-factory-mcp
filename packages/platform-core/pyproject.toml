[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["agent-factory-contracts"]

[tool.uv.sources]
agent-factory-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory_core"]
