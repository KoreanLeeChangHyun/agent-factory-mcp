[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory-mcp"
version = "0.1.0"
description = "Agent Factory Workspace and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-factory-api",
    "agent-factory-worker",
    "alembic",
    "aiosmtplib",
    "asyncpg",
    "authlib",
    "boto3",
    "celery[redis]",
    "croniter",
    "email-validator",
    "fastapi",
    "holidays>=0.81,<1",
    "httpx",
    "itsdangerous",
    "jsonschema>=4.23,<5",
    "mcp>=2,<3",
    "opentelemetry-sdk",
    "pgvector",
    "pydantic-settings",
    "python-multipart",
    "PyYAML",
    "pwdlib[argon2]",
    "prometheus-client",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages/contracts-py/src",
    "packages/platform-core/src",
    "packages/platform-adapters/src",
    "apps",
    "apps/worker/src",
]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires explicitly configured infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disable_error_code = ["arg-type", "attr-defined", "return-value", "union-attr", "valid-type"]
exclude = ["app/db/migrations"]

[tool.uv]
# The root is a workspace root: code lives in apps/* and packages/*, so do not build it as a package.
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/contracts-py",
    "packages/platform-core",
    "packages/platform-adapters",
]

[tool.uv.sources]
agent-factory-api = { workspace = true }
agent-factory-worker = { workspace = true }
