[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory-mcp"
version = "0.1.0"
description = "Agent Factory Workspace and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "aiosmtplib",
    "asyncpg",
    "authlib",
    "boto3",
    "celery[redis]",
    "croniter",
    "email-validator",
    "fastapi",
    "holidays>=0.81,<1",
    "httpx",
    "itsdangerous",
    "mcp>=2,<3",
    "opentelemetry-sdk",
    "pgvector",
    "pydantic-settings",
    "python-multipart",
    "PyYAML",
    "pwdlib[argon2]",
    "prometheus-client",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly configured infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disable_error_code = ["arg-type", "attr-defined", "return-value", "union-attr", "valid-type"]
exclude = ["app/db/migrations"]

[tool.setuptools.package-data]
"app.modules.document" = ["preview_runtime.js"]
"app.resources" = ["*.md", "document_template_inventory.json", "document_template/*", "document_template/vendor/*/*/*"]

[tool.setuptools.cmdclass]
build_py = "app.build_assets.BuildPy"
