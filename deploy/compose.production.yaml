services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "10.0.0.0/8"]
    environment:
      AGENT_FACTORY_ROOT_PATH: /factory
    restart: always
    networks: [backend, edge]
    deploy:
      replicas: 2
      update_config: {order: start-first, parallelism: 1, delay: 10s}
      rollback_config: {order: start-first, parallelism: 1}
      resources:
        limits: {cpus: "2", memory: 2G}

  worker:
    restart: always
    deploy:
      replicas: 3
      resources:
        limits: {cpus: "2", memory: 3G}

  scheduler:
    restart: always
    deploy:
      replicas: 1

  migrate:
    build: {context: .., dockerfile: Dockerfile}
    env_file: [../.env.production]
    command: ["alembic", "-c", "config/alembic.ini", "upgrade", "head"]
    profiles: [release]
    networks: [backend]

  proxy:
    image: caddy:2.10-alpine
    restart: always
    environment:
      AGENT_FACTORY_DOMAIN: ${AGENT_FACTORY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    depends_on:
      api: {condition: service_healthy}
    networks: [edge]

networks:
  edge: {}

volumes:
  caddy-data: {}
  caddy-config: {}
