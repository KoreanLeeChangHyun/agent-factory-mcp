name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --upgrade pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --extra dev
      - run: uv run ruff format --check apps packages tests
      - run: uv run ruff check apps packages tests
      - run: uv run mypy apps/api apps/worker/src packages/platform-core/src packages/platform-adapters/src
      - run: uv run pytest --cov=api --cov=agent_factory_worker --cov=agent_factory_core --cov=agent_factory_adapters --cov-report=term-missing --cov-fail-under=60
      - run: uv run bandit -q -r apps/api,apps/worker/src,packages/platform-core/src,packages/platform-adapters/src
      - run: uv run pip-audit
