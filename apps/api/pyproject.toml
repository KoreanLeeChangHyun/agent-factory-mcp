[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-factory-adapters",
    "agent-factory-contracts",
    "agent-factory-core",
    "fastapi",
    "pydantic>=2,<3",
    "pydantic-settings",
    "mcp>=2,<3",
    "redis",
    "prometheus-client",
    "opentelemetry-sdk",
    "itsdangerous",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2,<3",
    "starlette>=1.6",
]

[tool.uv.sources]
agent-factory-adapters = { workspace = true }
agent-factory-contracts = { workspace = true }
agent-factory-core = { workspace = true }

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "main.py", "settings.py", "paths.py", "logging.py", "observability.py", "composition", "http", "mcp"]
artifacts = ["http/routes/knowledge/preview_runtime.js"]

[tool.hatch.build.targets.wheel.sources]
"" = "api"
