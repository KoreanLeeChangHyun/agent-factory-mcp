[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-factory-adapters",
    "agent-factory-contracts",
    "agent-factory-core",
    "fastapi",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "starlette>=1.6",
]

[tool.uv.sources]
agent-factory-adapters = { workspace = true }
agent-factory-contracts = { workspace = true }
agent-factory-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory_api"]
