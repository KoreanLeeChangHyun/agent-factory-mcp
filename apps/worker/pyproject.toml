[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["agent-factory-adapters", "agent-factory-core", "celery[redis]"]

[project.scripts]
agent-factory-worker = "agent_factory_worker.main:main"

[tool.uv.sources]
agent-factory-adapters = { workspace = true }
agent-factory-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory_worker"]
