<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Factory</title><link rel="stylesheet" href="/workspace/styles.css"></head><body>
<section id="login" class="login" hidden><form id="login-form"><p class="kicker">Agent Factory</p><h1>워크스페이스 로그인</h1><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><button>로그인</button><p id="login-error" role="alert"></p></form></section>
<div id="shell" class="shell" hidden><header><a class="brand" href="/workspace/">AF <span>Agent Factory</span></a><div class="selectors"><label>조직<select id="organization"></select></label><label>워크스페이스<select id="workspace"></select></label></div><div><span id="user"></span><a id="admin-link" href="/admin/" hidden>Admin</a><button id="logout">로그아웃</button></div></header>
<nav aria-label="Workspace activities"><button data-activity="schedule">일정</button><button data-activity="agents">에이전트</button><button class="active" data-activity="documents">문서</button><button data-activity="integrations">외부연동</button><button data-activity="logs">로그</button><button data-activity="tests">테스트</button></nav>
<main><div class="title"><div><p class="kicker">Workspace activity</p><h1 id="activity-title">문서</h1></div><button id="refresh">새로고침</button></div><p id="state" role="status"></p><section id="content"></section></main></div><script src="/workspace/app.js" defer></script></body></html>
