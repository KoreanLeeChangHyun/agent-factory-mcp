<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Factory Admin</title>
    <link rel="icon" type="image/svg+xml" href="../static/images/agent-factory.svg">
    <link rel="stylesheet" href="../static/css/admin.css">
  </head>
  <body>
    <div class="admin-shell">
      <header class="title-bar">
        <div class="title-bar__brand"><img src="../static/images/agent-factory.svg" alt="" width="18" height="18"><span>Agent Factory</span></div>
        <div class="command-center" aria-label="현재 화면">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.75 19 7v5.25c0 4.25-2.9 7.05-7 8-4.1-.95-7-3.75-7-8V7l7-3.25Z"/><path d="M9 12.25 11 14l4-4.25"/></svg>
          <span>Platform administration</span>
        </div>
        <a class="title-bar__workspace" href="../workspace/"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6M8 12h11"/></svg><span>Workspace</span></a>
      </header>

      <nav class="activity-bar" aria-label="관리자 작업 표시줄">
        <button class="activity-button is-active" type="button" aria-label="플랫폼 관리" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5 19 6.75v5.5c0 4.25-2.9 7.05-7 8-4.1-.95-7-3.75-7-8v-5.5L12 3.5Z"/><path d="M9.25 12.25 11 14l3.75-4"/></svg></button>
        <a class="activity-button activity-button--bottom" href="../workspace/" aria-label="Workspace로 이동" title="Workspace로 이동"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 8h17M8 8v12"/></svg></a>
      </nav>

      <aside class="primary-sidebar" aria-label="플랫폼 관리 메뉴">
        <header class="primary-sidebar__header">Administrator</header>
        <div class="sidebar-section-label">Control plane</div>
        <nav class="admin-navigation" aria-label="관리자 메뉴">
          <button class="active" type="button" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>개요</span></button>
          <button type="button" data-view="users"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"/></svg><span>사용자</span></button>
          <button type="button" data-view="organizations"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V7l8-3v16M12 9h8v11M7.5 9.5h1M7.5 13h1M7.5 16.5h1M15.5 12.5h1M15.5 16h1"/></svg><span>조직</span></button>
          <button type="button" data-view="workspaces"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 8.5h17M9 8.5V20"/></svg><span>워크스페이스</span></button>
          <button type="button" data-view="jobs"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5h11M5 5h.01M8 12h11M5 12h.01M8 19h11M5 19h.01"/></svg><span>작업</span></button>
          <button type="button" data-view="integrations"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4v4M16 4v4M6 8h12v2a6 6 0 0 1-6 6v4M9 20h6"/></svg><span>연동</span></button>
          <button type="button" data-view="audit"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>감사 로그</span></button>
          <button type="button" data-view="feature-flags"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 21V4M6 5h11l-2 3 2 3H6"/></svg><span>기능 플래그</span></button>
          <button type="button" data-view="runtime"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="m7.5 9 2.5 2.5L7.5 14M12 14h4.5"/></svg><span>런타임</span></button>
        </nav>
        <div class="sidebar-footnote"><span>PLATFORM</span><strong>Administrator</strong></div>
      </aside>

      <main class="editor" aria-label="관리자 작업 영역">
        <header class="editor-tabs"><div class="editor-tab is-active"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.75 19 7v5.25c0 4.25-2.9 7.05-7 8-4.1-.95-7-3.75-7-8V7l7-3.25Z"/></svg><span id="tab-title">개요</span></div></header>
        <div class="editor-scroll">
          <header class="view-header">
            <div><p class="eyebrow">Control plane</p><h1 id="title">개요</h1><p class="view-description">Agent Factory 플랫폼의 계정, 작업 공간 및 런타임 상태를 관리합니다.</p></div>
            <span id="status" role="status">불러오는 중</span>
          </header>
          <section id="content" aria-live="polite"></section>
        </div>
      </main>

      <footer class="status-bar"><span>Agent Factory</span><span>Platform Administrator</span></footer>
    </div>
    <script src="../static/js/admin.js" defer></script>
  </body>
</html>
