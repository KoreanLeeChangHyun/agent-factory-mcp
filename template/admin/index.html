<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Factory Admin</title>
    <link rel="icon" type="image/svg+xml" href="../static/images/agent-factory.svg">
    <link rel="stylesheet" href="../static/css/admin.css">
  </head>
  <body>
    <aside>
      <div class="brand"><img src="../static/images/agent-factory.svg" alt="" width="34" height="34"><strong>Agent Factory</strong></div>
      <p class="eyebrow">Platform administration</p>
      <nav aria-label="관리자 메뉴">
        <button class="active" data-view="dashboard">Overview</button>
        <button data-view="users">Users</button>
        <button data-view="organizations">Organizations</button>
        <button data-view="workspaces">Workspaces</button>
        <button data-view="jobs">Jobs</button>
        <button data-view="integrations">Integrations</button>
        <button data-view="audit">Audit</button>
        <button data-view="feature-flags">Feature flags</button>
        <button data-view="runtime">Runtime</button>
      </nav>
      <a href="../workspace/" class="back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m14 6-6 6 6 6M8 12h11" />
        </svg>
        <span>Workspace</span>
      </a>
    </aside>
    <main>
      <header>
        <div><p class="eyebrow">Control plane</p><h1 id="title">Overview</h1></div>
        <span id="status" role="status">Loading…</span>
      </header>
      <section id="content" aria-live="polite"></section>
    </main>
    <script src="../static/js/admin.js" defer></script>
  </body>
</html>
