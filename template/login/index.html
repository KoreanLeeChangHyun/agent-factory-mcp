<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Agent Factory 로그인</title>
    <link rel="stylesheet" href="../static/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <form class="auth-card" aria-labelledby="login-title" data-login-form>
        <p class="auth-card__eyebrow">Agent Factory</p>
        <h1 id="login-title">Workspace 로그인</h1>
        <p class="auth-card__description">프로젝트 제어 공간을 열려면 계정으로 로그인하세요.</p>
        <!-- Google "G" logo follows the Google Identity branding guidance. -->
        <a class="google-auth-button" href="../api/auth/oauth/google/login" data-google-login hidden>
          <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false">
            <path fill="#4285f4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.702-1.567 2.684-3.875 2.684-6.614Z"/>
            <path fill="#34a853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.333A9 9 0 0 0 9 18Z"/>
            <path fill="#fbbc05" d="M3.963 10.706A5.41 5.41 0 0 1 3.681 9c0-.592.102-1.167.282-1.706V4.961H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.039l3.007-2.333Z"/>
            <path fill="#ea4335" d="M9 3.58c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.961l3.007 2.333C4.672 5.165 6.656 3.58 9 3.58Z"/>
          </svg>
          <span>Google로 계속</span>
        </a>
        <div class="auth-divider" data-password-login-divider hidden><span>또는</span></div>
        <label>이메일<input name="email" type="email" autocomplete="username" required /></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <button type="submit">로그인</button>
        <p class="auth-card__error" role="alert" data-login-error></p>
        <noscript><p class="auth-card__error">로그인하려면 JavaScript를 활성화해 주세요.</p></noscript>
      </form>
    </main>
    <script src="../static/js/login.js"></script>
  </body>
</html>
